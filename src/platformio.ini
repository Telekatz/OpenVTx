[platformio]

[env]
build_src_filter = +<*.c>
monitor_speed = 9600
build_flags =
	-D DEBUG=0
	-D OUTPUT_POWER_TESTING=0
	-D OFFSET=0.0 # dBm cal correction.  -ve and +ve offsets allowed.
	-D LED_INDICATION_OF_VTX_MODE=1

# -----------------------------

[env_stm8]
platform = ststm8
board = stm8sblue
framework = arduino
upload_protocol = stlinkv2
build_src_filter =
	${env.build_src_filter}
	+<stm8/*.c>
build_flags =
	${env.build_flags}
	-I src/stm8

# ----------

[IGNORE env:EACHINE_TX801]
extends = env_stm8
build_src_filter =
	${env_stm8.build_src_filter}
	+<targets/Eachine_TX801/*.c>
build_flags =
	${env_stm8.build_flags}
	-D EACHINE_TX801=1

[IGNORE env:EACHINE_TX526]
extends = env_stm8
build_src_filter =
	${env_stm8.build_src_filter}
	+<targets/Eachine_TX526/*.c>
build_flags =
	${env_stm8.build_flags}
	-D EACHINE_TX526=1

# -----------------------------

[env_gd32f130]
platform = ststm32@15.4.1
platform_packages =
    maxgerhardt/framework-spl@2.10300.0
    platformio/tool-dfuutil@1.11.0
    platformio/tool-openocd@2.1100.211028
    platformio/tool-stm32duino@1.0.1
    platformio/toolchain-gccarmnoneeabi@1.70201.0
framework = spl
board = gd32f130g6
build_src_filter =
	${env.build_src_filter}
	+<gd32f1x0/*.c>
build_flags =
	-Wall
	-Werror
	-Wextra
	${env.build_flags}
	-I src/gd32f1x0
	--specs=nano.specs
	-Wl,-Map,firmware.map
	#-D HXTAL_VALUE=8000000
	#-D __SYSTEM_CLOCK_72M_PLL_HXTAL=72000000U

# ----------

[env:Generic_GD32F130_develop]
extends = env_gd32f130
build_src_filter =
	${env_gd32f130.build_src_filter}
	+<targets/Generic_GD32F130/*.c>
build_flags =
	${env_gd32f130.build_flags}
	-D GENERIC_GD32F130=1

[env:Generic_GD32F130]
extends = env:Generic_GD32F130_develop
build_flags =
	${env:Generic_GD32F130_develop.build_flags}
	-Wl,--defsym=FLASH_APP_OFFSET=8K
upload_protocol = custom
upload_command =
	python scripts/uart_upload.py "$SOURCE"

# ----------

[env:EWRF_E7082VM]
extends = env:Generic_GD32F130

# -----------------------------

[env:Happymodel_OVX300]
extends = env:Generic_GD32F130

[env:Happymodel_OVX303]
extends = env:Generic_GD32F130

[env:Happymodel_OVX306]
extends = env:Generic_GD32F130

[env:Happymodel_Fyujon]
extends = env:Generic_GD32F130

[env:Happymodel_Whoop_AIO]
extends = env:Generic_GD32F130

[env:Happymodel_Pancake_develop]
extends = env_gd32f130
build_src_filter =
	${env_gd32f130.build_src_filter}
	+<targets/Generic_GD32F130/*.c>
build_flags =
	${env_gd32f130.build_flags}
	-D HAPPYMODEL_PANCAKE=1

[env:Happymodel_Pancake]
extends = env:Happymodel_Pancake_develop
build_flags =
	${env:Happymodel_Pancake_develop.build_flags}
	-Wl,--defsym=FLASH_APP_OFFSET=8K
upload_protocol = custom
upload_command =
	python scripts/uart_upload.py "$SOURCE"

# -----------------------------

[env:BETAFPV_A03_develop]
extends = env_gd32f130
build_src_filter =
	${env_gd32f130.build_src_filter}
	+<targets/Generic_GD32F130/*.c>
build_flags =
	${env_gd32f130.build_flags}
	-D BETAFPV_A03=1

[env:BETAFPV_A03]
extends = env:BETAFPV_A03_develop
build_flags =
	${env:BETAFPV_A03_develop.build_flags}
	-Wl,--defsym=FLASH_APP_OFFSET=8K
upload_protocol = custom
upload_command =
	python scripts/uart_upload.py "$SOURCE"

# -----------------------------

[env_stm32f10x]
platform = ststm32@15.4.1
platform_packages =
    maxgerhardt/framework-spl@2.10300.0
    platformio/tool-dfuutil@1.11.0
    platformio/tool-openocd@2.1100.211028
    platformio/tool-stm32duino@1.0.1
    platformio/toolchain-gccarmnoneeabi@1.70201.0
framework = stm32cube
board = genericSTM32F103CB
build_src_filter =
	${env.build_src_filter}
	+<stm32f10x/*.c>
build_flags =
	-Wall
	-Werror
	-Wextra
	-Wno-unused-parameter
	${env.build_flags}
	-I src/stm32f10x
	--specs=nano.specs
	-Wl,-Map,firmware.map
	-DUSE_HAL_DRIVER
	-O2

[env:Generic_stm32f10x]
extends = env_stm32f10x
build_src_filter =
	${env_stm32f10x.build_src_filter}
	+<targets/Generic_STM32F10x/*.c>
build_flags =
	${env_stm32f10x.build_flags}
	-D GENERIC_STM32F10x=1
debug_tool = jlink
upload_protocol = jlink
debug_speed = 4000

[env:stm32f103_OSD]
extends = env:Generic_stm32f10x
build_flags =
	${env:Generic_stm32f10x.build_flags}
	-D HAS_OSD=1

[env:Generic_stm32f10x_develop]
extends = env:Generic_stm32f10x
build_flags =
	${env:Generic_stm32f10x.build_flags}
	-D TRACE_LEVEL=TRACE_LEVEL_INFO
 	#-D PA_LIMIT=10
 	-Wno-unused-function

[env:stm32f103_OSD_develop]
extends = env:stm32f103_OSD
build_flags =
	${env:stm32f103_OSD.build_flags}
	-D TRACE_LEVEL=TRACE_LEVEL_INFO
 	#-D PA_LIMIT=1000
 	-Wno-unused-function

# ----------

